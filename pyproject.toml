[project]
name = "pixel-craft"
version = "0.1.0"
description = "Render rigged 3D models into consistent pixel art sprite sheets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["imageio-ffmpeg>=0.5"]

[project.scripts]
pixelcraft = "pixelcraft.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pixelcraft"]
